apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: fs-12345678.efs.region.amazonaws.com
    path: "/"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static-pvc
  namespace: practice
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: efs-pv
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-static-pod
  namespace: practice
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: efs-static-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: efs-static-volume
    persistentVolumeClaim:
      claimName: efs-static-pvc
