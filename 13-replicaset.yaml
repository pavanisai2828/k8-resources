apiVersion: v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 3
  selector:
    # replicaset uses these labels to match pods
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  template: # pod definition
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
      - image: nginx

