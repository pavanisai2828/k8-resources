apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: dev
spec:
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx #pod name
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec: # specifications
  containers:
  - name: nginx # contianer name
    image: nginx # by defauld it will get from docker_hub
