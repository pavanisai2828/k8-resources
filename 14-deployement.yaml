apiVersion: v1
kind: Deployement
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 10
  selector:
    matchLables:
      project: roboshop
      tier: frontend
      component: frontend
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      containers:
      -name: nginx
      -image: nginx-latest
