apiVersion: storage.k8s.io/v1 
kind: StorageClass
metadata:
  name: ebs-storageclass-example
provisioner: ebs.csi.aws.com
parameters:
  type: gp2
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic-example-pvc
  namespace: practice
spec:
  accessModes:
    ReadWriteOnce
  storageClassName: ebs-storageclass-example
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic-example-pod
  namespace: practice
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: ebs-storageclass-pod-vm
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-storageclass-pod-vm
    persistentVolumeClaim:
      claimName: ebs-dynamic-example-pvc
