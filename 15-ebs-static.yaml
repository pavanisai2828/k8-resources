apiVersion: v1
kind: Namespace
metadata:
  name: practice
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-provisioning-example-pv
  namespace: practice
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-046ed8b11c75872d5
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: static-provisioning-example-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: static-provisioning-example-Pod
  namespace: practice
spec:
  containers:
  - name: app
    image: nginx
    VolumeMounts:
    - name: ebs-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-storage
    PersistentVolumeClaim:
      claimName: static-provisioning-example-pvc